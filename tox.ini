# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
requires = tox-conda
envlist = py{38,39}-{linux,macos,windows}

[gh-actions]
python =
    3.8: py38
    #3.9: py39
    
[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform = 
    macos: darwin
    linux: linux
    windows: win32
passenv = 
    CI
    GITHUB_ACTIONS
    DISPLAY XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
extras = gui,distributed
conda_deps =
    pytest
    pytorch
    linux,windows: cudatoolkit=11.3
conda_channels = 
    pytorch
deps = 
    .[gui,distributed]
#    pytest
    pytest-cov
    pytest-xvfb
# ignoring contrib tests for now
commands = 
    conda env list
    conda env export
    windows: python -m cellpose --train --train_size --n_epochs 3 --dir C:\Users\runneradmin\.cellpose\data\2D\train --mask_filter _cyto_masks --pretrained_model cyto --chan 2 --chan2 1
    pytest -v --color=yes --cov=cellpose --cov-report=xml --ignore=tests/contrib 
